name: sus_nfc_tag_editor
description: "SUS NFC Tag Editor: lector y editor versátil de etiquetas NTAG216 de dudosa procedencia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  nfc_manager: ^4.2.1
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # El mismo logo que genera los iconos de lanzador, para no duplicarlo.
  assets:
    - .github/images/logo.png

# Genera los iconos de lanzador de cada plataforma a partir del logo.
# Se regeneran con: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: ".github/images/logo.png"
  android: true
  ios: true
  # Azul del fondo del logo, para que el icono adaptativo no desentone.
  adaptive_icon_background: "#358AEB"
  adaptive_icon_foreground: ".github/images/logo.png"
